# Sert l'export statique Expo Router (apps/client/dist). Les routes sont
# exportees en fichiers plats (ex. calendar.html, pas calendar/index.html) :
# on resout donc l'URL sans extension vers son .html avant de tomber sur la
# page 404 dediee, servie avec un vrai statut 404.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API path for the default Docker deployment. This avoids a
    # localhost URL being frozen into the static browser bundle.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /+not-found.html;
    location = /+not-found.html {
        internal;
    }
}
