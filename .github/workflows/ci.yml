name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (OPS-02, SEC-04, EVID-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install locked dependencies
        run: npm ci

      # npm run ci is the single local/CI verification entry point. Its order is:
      # config tests, secret scan, high/critical audit, traceability, typecheck,
      # TypeScript tests, Python optimizer tests, and the Expo web build.
      - name: Run deterministic CI checks
        run: npm run ci
