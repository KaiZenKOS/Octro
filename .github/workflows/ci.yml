name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, typecheck, test (OPS-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      # OPS-02 : lockfile pin exacte, jamais `npm install` en CI.
      - name: Install (lockfile only)
        run: npm ci

      - name: Secret scan (SEC-04)
        run: bash scripts/scan-secrets.sh

      - name: Typecheck (project references, tsc -b)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (P0, deterministe — aucun test reseau/Devnet ici)
        run: npm run test --workspaces --if-present
